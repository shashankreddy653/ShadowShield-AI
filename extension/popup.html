<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowShield AI</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <h1>🛡 ShadowShield AI</h1>

        <p class="subtitle">
            AI-Powered Cybersecurity
        </p>

        <!-- Current Website -->

        <div class="card">

            <label>Current Website</label>

            <div id="website">
                Detecting...
            </div>

        </div>

        <!-- Automatic Analysis -->

        <div id="loading">
            🔍 Analyzing website...
        </div>

        <div id="error" class="hidden"></div>

        <div id="result"></div>

        <hr>

        <!-- Personal Data Protection -->

        <h3>🛡️ Personal Data Protection</h3>

        <p class="description">
            Protect only the prompt you choose to scan.
        </p>

        <button id="protectBtn">
            🔒 Hide Personal Data
        </button>

        <div id="leakResult"></div>

        <hr>

        <h3>Recent Scans</h3>

        <div id="history">
            Loading history...
        </div>

    </div>

    <script src="popup.js"></script>

</body>

</html>
